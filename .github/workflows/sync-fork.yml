name: Sync resources.json

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *"   # UTC 02:00，北京时间 10:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream resources.json
        run: |
          mkdir -p resources
          curl -fsSL \
            "https://raw.githubusercontent.com/laoma528/awesome-zhuiju-free/main/resources/resources.json" \
            -o resources/resources.json
          # 简单校验一下拿到的确实是 JSON，避免把错误页写进去
          python3 -c "import json,sys; json.load(open('resources/resources.json'))" \
            || { echo "下载内容不是合法 JSON，中止"; exit 1; }

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add resources/resources.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "sync resources.json from upstream"
          git push
